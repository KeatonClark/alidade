name: Pipeline

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-hw:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@main
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build hardware package
        run: nix build .#hw -L

      - name: Parse stats
        id: parse-stats
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: nix run .#parse-kicad-results -- stats result/share/alidade/pcb/stats.json >> "$GITHUB_STEP_SUMMARY"

      - name: Parse ERC results
        id: parse-erc
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: nix run .#parse-kicad-results -- erc result/share/alidade/sch/erc.json >> "$GITHUB_STEP_SUMMARY"

      - name: Parse DRC results
        id: parse-drc
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: nix run .#parse-kicad-results -- drc result/share/alidade/pcb/drc.json >> "$GITHUB_STEP_SUMMARY"

      - name: Package outputs
        run: tar -czf alidade-hw-pkg.tar.gz -C result .

      - uses: actions/upload-artifact@v4
        with:
          name: alidade-hw-pkg
          path: alidade-hw-pkg.tar.gz
          retention-days: 7

      - name: Fail if any parser failed
        if: ${{ !cancelled() && (steps.parse-stats.outcome == 'failure' || steps.parse-erc.outcome == 'failure' || steps.parse-drc.outcome == 'failure') }}
        run: |
          echo "One or more KiCad result parsers failed." >> "$GITHUB_STEP_SUMMARY"
          exit 1

  build-docs:
    needs: build-hw
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@main
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build docs
        run: nix build .#docs -L

      - uses: actions/upload-pages-artifact@v4
        with:
          path: result/share/alidade/html/
          retention-days: 7

  deploy-docs:
    if: github.ref == 'refs/heads/main'
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
