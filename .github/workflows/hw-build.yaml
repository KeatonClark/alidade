name: Hardware

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wimpysworld/nothing-but-nix@main
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build Hardware Package
        run: nix build .#hw -L

      - name: Gather Outputs
        run: tar -czf alidade-hw-pkg.tar.gz -C result .

      - uses: actions/upload-artifact@v7
        with:
          name: alidade-hw-pkg_$(git rev-parse --short HEAD)
          path: alidade-hw-pkg.tar.gz
          archive: false
          retention-days: 7
      
