kibot:
  version: 1

preflight:
  erc:
    dont_stop: true
    format: CSV
    dir: erc

outputs:
- name: Schematic
  type: pdf_sch_print
  dir: schematic

- name: Bill of Materials
  type: bom
  dir: bom
  options:
    csv: 
      hide_pcb_info: true
      hide_stats_info: true

- name: KiCanvas
  type: kicanvas
  dir: kicanvas
  options:
    source: 
      - "schematic" 
    local_script: false
    overlay: false

- name: GLB
  type: export_3d
  dir: 3d
  options:
    format: glb
    download: false
    include_pads: true
    include_silkscreen: true
    include_tracks: true
