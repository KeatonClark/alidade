kibot:
  version: 1

preflight:
  erc:
    dont_stop: true
    format: CSV
    dir: erc

outputs:
- name: Schematic
  type: pdf_sch_print
  dir: schematic

- name: Bill of Materials
  type: bom
  dir: bom
  options:
    csv: 
      hide_pcb_info: true
      hide_stats_info: true

- name: KiCanvas
  type: kicanvas
  dir: kicanvas
  options:
    source: 
      - "schematic" 
    local_script: false
    overlay: false
